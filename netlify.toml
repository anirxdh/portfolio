[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# ---------- Security headers (every response) ----------
# The enforced Content-Security-Policy only has directives that never block loading anything: who
# may frame the site, <base> hijacking, and plugin content. A full policy is on trial below as
# Content-Security-Policy-Report-Only: browsers check every request against it and log what it
# would block in the console, but block nothing. Once it has run clean in production, its rules can
# move into the enforced header.
# microphone=(self): AniBot voice uses the Web Speech API on this origin. Nothing uses the camera
# or location. If an embedded third-party widget ever needs the mic, add its origin here.
# HSTS without includeSubDomains/preload until every subdomain is confirmed to serve HTTPS.
#
# What the report-only policy allows, and why:
#   default-src 'self'          anything not listed below may only come from this site.
#   script-src 'self'           the Vite bundles in /assets/. The homepage has no inline scripts
#                               (its <script type="application/ld+json"> blocks are data and are
#                               never run), so no 'unsafe-inline' and no 'unsafe-eval'.
#     'sha256-...'              the one inline script on article pages (reading progress bar and
#                               the Copy button on code blocks). `npm run build` prints this hash,
#                               and `node scripts/validate-seo.mjs` fails if it no longer matches.
#     'wasm-unsafe-eval'        the Draco decoder that unpacks the 3D models is WebAssembly. It
#                               allows compiling WebAssembly only, not eval() of JavaScript.
#   style-src 'self'            /assets/*.css and /blog/blog.css.
#     'unsafe-inline'           the article diagrams are inline SVG with style="" attributes and
#                               their own <style> blocks, and cards set their accent color in a
#                               style="" attribute.
#   font-src                    General Sans comes from fonts.cdnfonts.com. data: lets a font
#                               inlined as a data URL load; nothing uses one today.
#   img-src 'self' data: blob:  site images, a tiny data: image the 3D code uses to test WebP
#                               support, and textures three.js unpacks from the .glb models
#                               into blob: URLs.
#     https://unpkg.com         the About section globe's earth textures.
#   connect-src 'self'          /blog/index.json, /anibot-kb.json, /api/chat (AniBot), and the 3D
#                               models and Draco decoder files.
#     blob:                     three.js reads the textures packed inside each .glb model through
#                               fetch() on a blob: URL.
#     https://api.emailjs.com   the contact form sends through EmailJS.
#   worker-src 'self' blob:     the Draco decoder runs in a Web Worker built from a blob: URL.
#   object-src 'none'           no Flash or other plugin content anywhere.
#   frame-ancestors 'self'      only this site may put the site in a frame (same as the enforced CSP).
#   base-uri 'self'             a <base> tag can not point relative links at another site.
#   form-action 'self'          forms can only submit to this site (the contact form posts with
#                               fetch, not a form submit, so EmailJS is not needed here).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
    Content-Security-Policy-Report-Only = """\
      default-src 'self'; \
      script-src 'self' 'sha256-PkutnMyKjij+HZ69YKjEUuRS6r0+Q/dA7fHCTk7v2nE=' 'wasm-unsafe-eval'; \
      style-src 'self' 'unsafe-inline'; \
      font-src https://fonts.cdnfonts.com data:; \
      img-src 'self' data: blob: https://unpkg.com; \
      connect-src 'self' blob: https://api.emailjs.com; \
      worker-src 'self' blob:; \
      object-src 'none'; \
      frame-ancestors 'self'; \
      base-uri 'self'; \
      form-action 'self'"""
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"

# ---------- Caching ----------
# Vite's build output has a content hash in every file name, so it can be cached forever.
# Only .js and .css: public/assets (images, the resume PDF, og-image) is also served from /assets/
# under fixed names and must keep Netlify's default revalidation.
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 3D models, the Draco decoder and textures keep their names when they change, so cache for a day
# only. When a model changes in a way the code depends on (node or material names), give the file
# a new name so returning visitors never pair new code with an old cached model.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Article diagrams: a stale copy is harmless, so serve it while revalidating in the background.
[[headers]]
  for = "/blog/diagrams/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Send the old Netlify subdomain (and www) to the canonical domain — one URL for SEO.
[[redirects]]
  from = "https://anirudhvasudevan.netlify.app/*"
  to = "https://anirudhvasudevan.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.anirudhvasudevan.com/*"
  to = "https://anirudhvasudevan.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# No SPA fallback: the app has no client-side routes (only #anchors), so unknown paths get a
# real 404 (public/404.html) instead of a soft-404 homepage.

